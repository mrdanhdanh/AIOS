# AIOS Plan — Activate & Confirm 9 Verified Flows (docs/AIOS_System_Diagram.md §14)
# Each node runs the canonical entry-point for one flow and prints a confirmation.
# Safe: idempotent checks + offline deterministic pipelines. No destructive cmds.
# Shell-agnostic: pytest / aiagent / python -c (no PS cmdlets, no ';' chains).

workflow:
  name: Activate and Confirm 9 AIOS Flows
  version: 0.1.0
  permissions: [process.execute]
  nodes:
    # Flow A — Coordinator Agent + 7 Governance Gates + Lifecycle
    # Uses the self-authored TASK-225 (N5 website), not a pre-existing task.
    - id: flow-a-coordinator-gates
      type: task
      command: aiagent task TASK-225 --job-dir D:\AIOS\work\20260825-nihongo-n5\logs

    # Flow B — Real OS Execution (T222) via aiagent execute
    # Runs the lightweight sub-plan (writes a real artifact) to prove the
    # Real Executor works without recursing into the heavy 9-flow plan.
    - id: flow-b-real-executor
      type: task
      command: aiagent execute D:\AIOS\work\20260825-nihongo-n5\plan-sub.yaml --work-dir D:\AIOS\work\20260825-nihongo-n5 --yes --timeout 120

    # Flow C — Architecture Guard (ARCH-001..004) AST import scanner
    - id: flow-c-architecture-guard
      type: task
      command: python -m pytest D:\AIOS\aios\governance\architecture -q

    # Flow D — Local CI gate (fail-closed pre-push)
    - id: flow-d-local-ci
      type: task
      command: aiagent ci check --scope core

    # Flow E — Registry (R1) + Dependency (R2) validation
    - id: flow-e-registry-dependency
      type: task
      command: python D:\AIOS\aios\governance\cli\parse_spec.py --spec D:\AIOS\docs\AIOS_Master_Task_Specification_M0-M26.md

    # Flow F — Harness / Verify-the-Verifier
    - id: flow-f-harness
      type: task
      command: python -m pytest D:\AIOS\aios\harness -q

    # Flow G — Decision Pipeline (deterministic-first, KNOWN_INTENT) 0 LLM
    - id: flow-g-decision-pipeline
      type: task
      command: python -c "from aios.orchestrator.decision_pipeline import DecisionPipeline; p=DecisionPipeline(); r=p.execute('status'); print('DECISION_RESULT:', str(r)[:200]); print('LLM_CALLS:', p.llm_call_count)"

    # Flow H — Coder Agent / Coding Plane (optional, offline smoke test)
    - id: flow-h-coding-plane
      type: task
      command: python -c "from aios.coding_edition import CodingEdition; ce=CodingEdition(); diags=ce.doctor.diagnose(); print('CODING_EDITION_LOADED:', type(ce).__name__); print('DOCTOR_DIAGNOSTICS:', len(diags)); print('HEALTHY:', ce.doctor.is_healthy(diags))"

    # Flow I — Practical Planner Loop (T220-224): execute sub-plan -> real artifact
    - id: flow-i-planner-loop
      type: task
      command: aiagent execute D:\AIOS\work\20260825-nihongo-n5\plan-sub.yaml --work-dir D:\AIOS\work\20260825-nihongo-n5 --yes
