[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aios"
version = "0.2.0"
description = "AIOS - Runtime-First, Plugin-First, Offline-First AI Operating System (M1 scaffold)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
aiagent = "aios.cli.workflow_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "aios[api]",
]
api = [
    "fastapi>=0.110",
    "pydantic>=2",
    "uvicorn>=0.29",
    "starlette>=0.36",
    "httpx>=0.27",
    "websockets>=12",
    "anyio>=4",
]

[tool.setuptools.packages.find]
include = ["aios*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["aios"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["aios"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
