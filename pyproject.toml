[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aios"
version = "0.1.0"
description = "AIOS - Runtime-First, Plugin-First, Offline-First AI Operating System (M0 governance)"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["aios", "aios.core", "aios.runtime", "aios.harness", "aios.governance"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["aios"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
